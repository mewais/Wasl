[package]
name = "wasl-runtime-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasl runtime protocol (R2): concrete interactive drivers over the R1 driver seam (Phase-2B: the long-lived fake structured agent + FakeLineProtocol)"

# The long-lived in-repo fake structured agent (runtime-protocol.md §1.1). A
# `[[bin]]` declared IN THIS crate makes Cargo define `CARGO_BIN_EXE_wasl-fake-agent`
# for this crate's own integration tests (same mechanism `wasl-mcp/tests/config_bin.rs`
# uses for `wasl-mcpd`), so `tests/support/mod.rs`'s `fake_agent_bin()` resolves.
[[bin]]
name = "wasl-fake-agent"
path = "src/bin/wasl-fake-agent.rs"

# Lint allowances below exist ONLY to accommodate the FROZEN test files the
# code-agent may not edit (`tests/**`, owned by the test-agent). `src/**` is
# clean of every one of these — verified: `cargo clippy -p wasl-runtime-protocol
# --lib --bins -- -D warnings` passes with none of these allowances. Same repo
# convention as `wasl-runtime`/`wasl-adapter-*` (per-package frozen-test carve-outs).
[lints.rust]
# tests/hold_queueing.rs (frozen) does `use wasl_runtime::RuntimeProvider;` but
# calls the provider's INHERENT `target_for` (not the trait method), so the
# `RuntimeProvider` import is redundant → `unused_imports`. The code-agent cannot
# edit the test; `src/**` has zero unused imports.
unused_imports = "allow"

[lints.clippy]
# Frozen test doc comments (`tests/hostile_inputs.rs`, `tests/fake_agent_wire.rs`)
# use un-indented multi-line `//!` list continuations that trip
# `doc_lazy_continuation` — a pure STYLE lint. The code-agent cannot edit tests;
# `src/**` is clean.
doc_lazy_continuation = "allow"
# `tests/hostile_inputs.rs:93` writes `|e| pred(e)` (a redundant closure over a
# `&dyn Fn`) — a test-agent style choice the code-agent cannot change; `src/**`
# has no redundant closures.
redundant_closure = "allow"

[features]
# Real-CLI tests are gated behind this cargo feature (NOT `#[ignore]`), per
# `docs/specs/runtime-protocol.md` §"`--features live-cli` discipline" and the
# `wasl-adapter-claude`/`wasl-adapter-opencode` `tests/live.rs` precedent —
# default CI never spends tokens; the orchestrator asserts these RAN in
# explicit verification passes: `cargo test -p wasl-runtime-protocol --features
# live-cli`.
live-cli = []

[dependencies]
wasl-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "io-std", "time", "sync", "macros", "rt", "rt-multi-thread", "signal"] }
# Phase 4 (`ClaudeStreamProtocol`): mints a byte-stable UUIDv5 session id from a
# context id, EXACTLY as `wasl-adapter-claude::session_uuid` does — same
# UUIDv5 scheme AND the SAME literal namespace value (`2441e851-1801-440d-
# a8e9-214d1df08e6e`), so a context_id maps to the SAME native claude session
# whether delivered via the ephemeral adapter or the managed runtime. The
# constant is independently DECLARED here (no cross-crate dependency on
# `wasl-adapter-claude`, per this crate's own dependency direction), not
# imported, but is bit-for-bit identical by design; see
# `crates/wasl-runtime-protocol/AGENTS.md` Phase-4 section.
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tokio = { workspace = true }
# The genericity actor-integration test (`tests/hold_queueing.rs`) builds a
# `TurnRequest`, which needs the same vocabulary crates R1's own support uses.
wasl-adapter = { workspace = true }
wasl-proto = { workspace = true }
wasl-audit = { workspace = true }
# Phase-2C (`tests/bidirectional_genericity.rs`) drains the actor's public
# `TurnEventStream` (a `Pin<Box<dyn Stream>>`) via `StreamExt::next`, exactly as
# R1's own `provider_and_journal.rs` does — needs `futures` in scope. Added per
# the tester-specified dev-dep precedent this file's `[dev-dependencies]` already
# set (`wasl-adapter`/`wasl-proto`/`wasl-audit` were added the same way for the
# `hold_queueing.rs` genericity test).
futures = { workspace = true }
