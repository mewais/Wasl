[package]
name = "wasl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Wasl host daemon: Wasit session runtime + Wasl node, MCP server, shim and bridge in one binary"

[lib]
name = "wasl_daemon"
path = "src/lib.rs"

[[bin]]
name = "wasl"
path = "src/main.rs"

[features]
# `--panic-test <marker>` on any subcommand: panics with a message holding the marker once the
# process's diagnostics are set up. For tests/diag_panic.rs; enabled by this package's
# dev-dependency on itself below, so no build for use has it.
panic-test = []

[dependencies]
wasl-proto = { workspace = true }
wasl-node = { workspace = true }
wasl-mcp = { workspace = true }
wasit-core = { workspace = true }
wasit-control = { workspace = true }
wasit-runtime = { workspace = true }
wasit-shim = { workspace = true }
wasit-process = { workspace = true }
wasit-diag = { workspace = true, features = ["tracing"] }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
wasl = { path = ".", features = ["panic-test"] }
wasl-mcp = { workspace = true }
wasit-fake-cli = { workspace = true }
wasit-runtime = { workspace = true }
rmcp = { version = "0.9", features = ["client", "transport-child-process"] }
futures = { workspace = true }
fastrand = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
