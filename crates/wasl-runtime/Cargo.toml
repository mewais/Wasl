[package]
name = "wasl-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasl runtime (R1): generic managed-runtime core — the type/trait surface for live targets, the driver seam, and the public TurnEvent vocabulary"

[dependencies]
wasl-proto = { workspace = true }
wasl-audit = { workspace = true }
wasl-adapter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

# All lint allowances below exist ONLY to accommodate the FROZEN test files the
# code-agent may not edit (`tests/**`, owned by the test-agent). `src/` is clean
# of every one of these — verified: `cargo clippy -p wasl-runtime --lib --
# -D warnings` passes with none of these allowances. Same repo convention as
# wasl-adapter-claude/-codex/-opencode/-antigravity (per-package frozen-test
# lint carve-outs).
[lints.rust]
# tests/support/mod.rs (frozen) does `use wasl_runtime::NativeGateResolver;` to
# call `resolve_native_gate` on an `Arc<dyn DeliveryTarget>`. Because the coder
# exposes that method by making `NativeGateResolver` a SUPERTRAIT of
# `DeliveryTarget` (runtime.md §9 — the method must be reachable on the
# trait-object the provider returns), the supertrait method is reachable via
# `DeliveryTarget` alone, so the explicit `NativeGateResolver` import is
# redundant → `unused_imports`. The code-agent cannot edit the test; `src/` has
# zero unused imports.
unused_imports = "allow"
# tests/ephemeral_target.rs (frozen) defines a helper method (`FakeAdapter::calls`)
# that is not used by the assertions in that file. With `--all-targets` and
# `-D warnings`, this triggers `dead_code` from the test target. The code-agent
# cannot edit frozen tests.
dead_code = "allow"

[lints.clippy]
# tests/control_api_wire.rs (frozen) calls `serde_json::to_value(&caps)` where
# `caps` is a `RuntimeCapabilities` — which the spec (§2) mandates be `Copy`. On
# a `Copy` type the `&` trips clippy::needless_borrows_for_generic_args (a pure
# STYLE lint). `Copy` is spec-required, so silence this style lint package-wide.
needless_borrows_for_generic_args = "allow"
# tests/support/mod.rs (frozen) writes an explicit `impl Default for
# ProtocolScript` that clippy::derivable_impls would prefer be `#[derive]`d — a
# test-agent style choice the code-agent cannot change.
derivable_impls = "allow"
# tests/write_ahead_audit.rs (frozen) returns a nested tuple/Arc/Mutex type from
# `OrderStampingSink::new` that trips clippy::type_complexity — again a
# test-agent choice in a file the code-agent cannot edit.
type_complexity = "allow"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
