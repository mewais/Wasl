[package]
name = "wasl-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasl MCP server: exposes consult/command/message/transfer as MCP tools, gating each via elicitation and dispatching over REAL async A2A (wasl-dispatch)"

[[bin]]
name = "wasl-mcpd"
path = "src/main.rs"

# The frozen `tests/handle.rs` module doc trips clippy's `doc_lazy_continuation`
# (a prose paragraph clippy reads as a lazy list continuation). The test file is
# frozen (acceptance fixture) and cannot be edited, so allow the lint crate-wide;
# it is a documentation-formatting nit, not a correctness lint.
[lints.clippy]
doc_lazy_continuation = "allow"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wasl-proto = { workspace = true }
wasl-gate = { workspace = true }
wasl-audit = { workspace = true }
wasl-registry = { workspace = true }
wasl-transfer = { workspace = true }
wasl-server = { workspace = true }
# Real async A2A send path (replaces the retired sync wasl-daemon Mesh).
wasl-dispatch = { workspace = true }
reqwest = { workspace = true }
# Durable/real default seams for run().
wasl-filesink = { workspace = true }
wasl-procrunner = { workspace = true }
# Receive-side wiring for run() (IO shell, UNTESTED HERE).
wasl-a2a-server = { workspace = true }
wasl-a2a-types = { workspace = true }
wasl-adapter = { workspace = true }
wasl-adapter-claude = { workspace = true }
wasl-node = { workspace = true }
rmcp = { version = "0.9", features = ["server", "transport-io", "elicitation"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "net"] }
# Node config file parsing (W2, src/config.rs). NOT a workspace dependency: the
# root Cargo.toml [workspace.dependencies] table is owned by a concurrently
# landing crate, so this dep is direct here rather than workspace-hoisted.
toml = "0.8"

[dev-dependencies]
# Client + async-rw transport, dev-only, so the smoke test can drive the server
# over an in-memory duplex pipe and list its tools. Same version as the main dep.
rmcp = { version = "0.9", features = ["client", "server", "transport-async-rw"] }
# Loopback A2A heart tests: a real A2aServer over a real AdapterExecutor wrapping a
# fake AgentAdapter, served on 127.0.0.1:0 via axum, plus #[tokio::test] + TcpListener.
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "net"] }
wasl-a2a-server = { workspace = true }
wasl-a2a-types = { workspace = true }
wasl-adapter = { workspace = true }
wasl-transfer = { workspace = true }
# `config_resolve.rs` / `config_wiring.rs` / `config_bin.rs` (W2, tests/**
# only): tempdirs/tempfiles for path-resolution + spawned-binary tests, and an
# executable stub-CLI file for the adapter-factory custom-bin test. Never used
# to mutate real process env (see docs/specs/node-config.md).
tempfile = "3"
