[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
wasl-proto = { path = "crates/wasl-proto" }
wasl-audit = { path = "crates/wasl-audit" }
wasl-node = { path = "crates/wasl-node" }
wasl-mcp = { path = "crates/wasl-mcp" }

# Wasit: one pinned git source; local development overrides it with a `[patch]` in an
# untracked `.cargo/config.toml` (see README.md).
wasit-core = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-control = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-runtime = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-shim = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-fake-cli = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }
wasit-process = { git = "https://github.com/mewais/Wasit", branch = "session-flows" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
fastrand = "2"
rmcp = { version = "0.9", features = ["server", "transport-io", "elicitation"] }
