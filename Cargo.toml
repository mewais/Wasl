[workspace]
resolver = "2"
members = [
    "crates/wasl-proto",
    "crates/wasl-gate",
    "crates/wasl-registry",
    "crates/wasl-mailbox",
    "crates/wasl-transfer",
    "crates/wasl-audit",
    "crates/wasl-marsad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"
repository = "https://github.com/mewais/Wasl"

[workspace.dependencies]
wasl-proto = { path = "crates/wasl-proto" }
wasl-gate = { path = "crates/wasl-gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
