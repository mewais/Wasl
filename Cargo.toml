[workspace]
resolver = "2"
members = [
    "crates/wasl-proto",
    "crates/wasl-gate",
    "crates/wasl-registry",
    "crates/wasl-mailbox",
    "crates/wasl-transfer",
    "crates/wasl-audit",
    "crates/wasl-marsad",
    "crates/wasl-server",
    "crates/wasl-daemon",
    "crates/wasl-e2e",
    "crates/wasl-mcp",
    "crates/wasl-mesh",
    "crates/wasl-a2a-types",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"
repository = "https://github.com/mewais/Wasl"

[workspace.dependencies]
wasl-proto = { path = "crates/wasl-proto" }
wasl-gate = { path = "crates/wasl-gate" }
wasl-audit = { path = "crates/wasl-audit" }
wasl-registry = { path = "crates/wasl-registry" }
wasl-mailbox = { path = "crates/wasl-mailbox" }
wasl-transfer = { path = "crates/wasl-transfer" }
wasl-a2a-types = { path = "crates/wasl-a2a-types" }
wasl-marsad = { path = "crates/wasl-marsad" }
wasl-server = { path = "crates/wasl-server" }
wasl-daemon = { path = "crates/wasl-daemon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
